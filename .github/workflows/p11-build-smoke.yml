name: MK DOS extractor source build smoke

# Source-only quality gate for interim branches and stable checkpoints.
# No original commercial game files are uploaded, read or distributed here.
# The committed npm 11 lockfile is validated with strict npm ci; the archived
# historical P11 lockfile remains separately preserved and is NOT byte-identical.
on:
  push:
    branches: [develop, main, 'interim/p79-original-extraction']
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/p11-build-smoke.yml'
      - '.github/scripts/windows_ci.py'
  pull_request:
    branches: ['develop']
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/p11-build-smoke.yml'
      - '.github/scripts/windows_ci.py'
  workflow_dispatch:
    inputs:
      upload_browser:
        description: Store a verified browser build for download
        type: boolean
        default: false

# Serialize requested browser uploads across branches for the repository-wide cap.
concurrency:
  group: ${{ inputs.upload_browser && 'mk-browser-artifact-upload' || format('mk-smoke-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  source-build:
    runs-on: windows-latest
    timeout-minutes: 20
    # Git for Windows provides Bash; preserve fail-fast semantics of existing
    # research regression command blocks while all jobs run on Windows.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Use npm 11 peer-dependency resolver for lockfile generation
        run: npm install --global npm@11.19.1
      - name: Strict install from committed dependency lock
        run: npm ci --no-audit --no-fund
      - name: Source syntax validation
        run: |
          npm run test:syntax
          node --check scripts/verify-p21-checkpoint.cjs
          node --check scripts/verify-cross-game-p21.cjs
          node --check scripts/verify-mk2-p22-cave.cjs
          node --check scripts/verify-mk2-p22-cumulative.cjs
          node --check scripts/verify-mk2-p23-armory.cjs
          node --check scripts/verify-mk2-p23-cumulative.cjs
          node --check scripts/verify-mk2-p24-battle.cjs
          node --check scripts/verify-mk2-p24-cumulative.cjs
          node --check scripts/verify-mk2-p25-arena.cjs
          node --check scripts/verify-mk2-p25-cumulative.cjs
          node --check scripts/verify-p26-checkpoint.cjs
          node --check scripts/verify-p31-checkpoint.cjs
          node --check scripts/verify-p36-checkpoint.cjs
          node --check scripts/verify-p41-checkpoint.cjs
          node --check scripts/verify-p46-checkpoint.cjs
          node --check scripts/verify-p51-checkpoint.cjs
          node --check scripts/verify-p50-indexed-acceptance.cjs
          node --check scripts/verify-mk1-p50-indexed-export.cjs
          node --check scripts/verify-mk2-p47-queue-exports.cjs
          node --check scripts/verify-mk2-p48-indexed-export.cjs
          node --check scripts/test-p48-indexed-export.cjs
          node --check scripts/verify-p45-mk2-acceptance.cjs
          node --check scripts/verify-mk2-p37-source-coverage.cjs
          node --check scripts/verify-mk2-p38-tomb-coverage.cjs
          node --check scripts/verify-mk2-p40-portal-preflight.cjs
          node --check scripts/verify-mk2-p40-portal-coverage.cjs
          node --check scripts/verify-mk1-p52-fallback-indexed.cjs
          node --check scripts/test-p54-mk1-stage-bindings.cjs
          node --check scripts/verify-mk1-p54-stage-joins.cjs
          node --check scripts/test-p55-stage-gallery-navigation.cjs
          node --check scripts/verify-mk1-p55-stage-navigation.cjs
          node --check scripts/verify-p56-checkpoint.cjs
          node --check scripts/test-p56-checkpoint-controls.cjs
          node --check scripts/test-p57-cross-game-thumbnails.cjs
          node --check scripts/verify-p57-cross-game-gallery.cjs
          node --check scripts/test-p58-mk2-palette-evidence.cjs
          node --check scripts/verify-mk2-p58-palette-evidence.cjs
          node --check scripts/test-p60-tomb-components.cjs
          node --check scripts/verify-mk2-p60-tomb.cjs
          node --check scripts/verify-mk2-p61-tomb-independent.cjs
          node --check scripts/test-p64-mk2-score.cjs
          node --check scripts/test-p65-mk1-anitab-streams.cjs
          node --check scripts/verify-mk1-p65-anitab-streams.cjs
          node --check scripts/verify-mk2-p64-scores.cjs
          node --check scripts/verify-p61-checkpoint.cjs
          node --check scripts/test-p61-checkpoint-controls.cjs
          node --check scripts/verify-mk2-p43-tower-coverage.cjs
          node --check scripts/test-p37-source-coverage.cjs
          node --check scripts/verify-p26-visual-baseline.cjs
          node --check scripts/verify-mk2-p27-tomb.cjs
          node --check scripts/verify-mk2-p28-portal.cjs
          node --check scripts/verify-mk2-p29-tower.cjs
          node --check scripts/verify-mk2-p30-forest.cjs
          node --check scripts/verify-mk2-p32-forest-tail.cjs
          node --check scripts/verify-mk2-p33-pit.cjs
          node --check scripts/verify-mk2-p34-armory-tail.cjs
          node --check scripts/verify-mk2-p35-arena-tail.cjs
          node --check scripts/verify-mk2-p35-cumulative.cjs
          node --check scripts/verify-mk2-p34-cumulative.cjs
          node --check scripts/verify-mk2-p33-cumulative.cjs
          node --check scripts/verify-mk2-p32-cumulative.cjs
          node --check scripts/verify-mk2-p30-cumulative.cjs
          node --check scripts/verify-mk2-p29-cumulative.cjs
          node --check scripts/verify-mk2-p28-cumulative.cjs
          node --check scripts/verify-mk2-p27-cumulative.cjs
      - name: P31 checkpoint preflight and source-audit refusal controls (no game data)
        run: python scripts/test-p31-checkpoint-controls.py
      - name: P36 checkpoint preflight and source-audit refusal controls (no game data)
        run: python scripts/test-p36-checkpoint-controls.py
      - name: P37 source interval accounting controls (no game data)
        run: node scripts/test-p37-source-coverage.cjs
      - name: P40 PORTAL source-gap preflight and false-claim controls (no game data)
        run: node scripts/verify-mk2-p40-portal-preflight.cjs
      - name: P41 checkpoint refusal controls (no game data)
        run: python scripts/test-p41-checkpoint-controls.py
      - name: P45 acceptance runner refusal controls (no game data)
        run: python scripts/test-p45-checkpoint-controls.py
      - name: P46 checkpoint refusal controls (no game data)
        run: python scripts/test-p46-checkpoint-controls.py
      - name: P47 independent APNG verifier load (no game data)
        run: python scripts/verify-mk2-p47-apng-independent.py --help
      - name: P48 indexed export guards (dummy data only)
        run: node scripts/test-p48-indexed-export.cjs
      - name: P48 independent indexed verifier load (no game data)
        run: python scripts/verify-mk2-p48-indexed-independent.py --help
      - name: P49 embedded palette export guards (dummy data only)
        run: node scripts/test-p49-palette-export.cjs
      - name: P49 original IFF checker load (no game data)
        run: python scripts/verify-mk3-p49-palettes-independent.py --help
      - name: P50 cross-game runner refusal controls (no game data)
        run: python scripts/test-p50-checkpoint-controls.py
      - name: P51 checkpoint refusal controls (no game data)
        run: python scripts/test-p51-checkpoint-controls.py
      - name: P54 MK1 source-header provenance join controls (no game data)
        run: node scripts/test-p54-mk1-stage-bindings.cjs
      - name: P55 evidence-gated MK1 gallery navigation controls (no game data)
        run: node scripts/test-p55-stage-gallery-navigation.cjs
      - name: P56 consolidation runner refusal controls (no game data)
        run: node scripts/test-p56-checkpoint-controls.cjs
      - name: P57 three-game source-image qualification and refusal controls (no game data)
        run: node scripts/test-p57-cross-game-thumbnails.cjs
      - name: P58 source-qualified MK2 palette comparison refusals (no game data)
        run: node scripts/test-p58-mk2-palette-evidence.cjs
      - name: P59 Tomb sample projection and source refusals (no game data)
        run: node scripts/test-p59-tomb.cjs
      - name: P60 independent Tomb component export and provenance refusals (no game data)
        run: node scripts/test-p60-tomb-components.cjs
      - name: P61 consolidated original-fixture runner preflight refusals (no game data)
        run: node scripts/test-p61-checkpoint-controls.cjs
      - name: P63 MK3 audio interval controls
        run: node scripts/test-p63-mk3-audio.cjs
      - name: P62 MK1 audio source and evidence join controls
        run: node scripts/test-p62-mk1-audio.cjs
      - name: P64 original MK2 score provenance and source-boundary refusals (synthetic)
        run: node scripts/test-p64-mk2-score.cjs
      - name: P65 MK1 ANITAB indexed original-stream provenance and false-source controls
        run: node scripts/test-p65-mk1-anitab-streams.cjs
      - name: Git-safe tracked-file and P16 input-audit-script guard
        run: python .github/scripts/windows_ci.py guard
      - name: P66 cumulative acceptance refusals (no game data)
        run: python scripts/test-p66-checkpoint.py
      - name: P67 downloaded selection readback controls (synthetic)
        run: |
          node --check scripts/verify-p67-browser.cjs
          python scripts/test-p67-download.py
      - name: P68 transactional same-tab source replacement refusals (no game data)
        run: |
          node scripts/test-p68-directory-switch.cjs
          node --check scripts/verify-p68-browser-switch.cjs
          python scripts/test-p68-switch-readback.py
      - name: P69 on-demand MK3 fighter indexed sprite bundle and source refusal controls
        run: |
          node --check scripts/test-p69-mk3-ftr-indexed.cjs
          node --check scripts/verify-mk3-p69-ftr-indexed.cjs
          node --check scripts/verify-p69-browser-ftr.cjs
          python -c "import ast,pathlib;ast.parse(pathlib.Path('scripts/check-p69-browser-ftr.py').read_text(encoding='utf-8'))"
          python -c "import ast,pathlib;ast.parse(pathlib.Path('scripts/verify-mk3-p69-ftr-independent.py').read_text(encoding='utf-8'))"
          node scripts/test-p69-mk3-ftr-indexed.cjs
      - name: P70 MK3 original GOG CUE-linked OGG tracks and 15 source/mismatch refusals
        run: |
          node --check scripts/test-p70-mk3-cue-music.cjs
          node --check scripts/verify-mk3-p70-cue.cjs
          node --check scripts/verify-p70-browser-cue.cjs
          python -c "import ast,pathlib;ast.parse(pathlib.Path('scripts/verify-mk3-p70-cue-independent.py').read_text(encoding='utf-8'))"
          node scripts/test-p70-mk3-cue-music.cjs
      - name: P71 cumulative original fixture and browser checkpoint refusal controls (no game data)
        run: |
          python -c "import ast,pathlib;ast.parse(pathlib.Path('scripts/verify-p71-checkpoint.py').read_text(encoding='utf-8'))"
          python scripts/test-p71-checkpoint.py
      - name: P72 original MK3 indexed-to-IFF CMAP comparison source and false ownership controls
        run: |
          node --check scripts/test-p72-mk3-cmap-comparison.cjs
          node --check scripts/verify-mk3-p72-cmap.cjs
          node --check scripts/verify-p72-browser-cmap.cjs
          python -c "import ast,pathlib;ast.parse(pathlib.Path('scripts/verify-mk3-p72-iff-cmap-independent.py').read_text(encoding='utf-8'))"
          node scripts/test-p72-mk3-cmap-comparison.cjs
          node --check scripts/test-p72-browser-panel-guard.cjs
          node scripts/test-p72-browser-panel-guard.cjs
      - name: P73 source-only MK3 non-IFF palette candidate provenance controls
        run: |
          python -m py_compile scripts/mk3_p73_noniff_palette_candidates.py
          python scripts/test_mk3_p73_noniff_palette_candidates.py
      - name: P74 MK3 first-stream indexed graphics source-only RLE and PNG refusals
        run: |
          python -m py_compile scripts/mk3_p74_noniff_indexed_graphics.py
          python -m py_compile scripts/verify_mk3_p74_noniff_independent.py
          python scripts/test_mk3_p74_noniff_indexed_graphics.py
          python scripts/verify_mk3_p74_noniff_independent.py --help > /dev/null
      - name: P75 original MK3 source-row mapping and independent PNG source-only controls
        run: |
          python -m py_compile scripts/mk3_p75_noniff_row_tables.py
          python -m py_compile scripts/verify_mk3_p75_noniff_independent.py
          python scripts/test_mk3_p75_noniff_row_tables.py
          python scripts/verify_mk3_p75_noniff_independent.py --help > /dev/null
      - name: P76 original MK3 opt-in indexed row assets, ZIP provenance, and malformed-source refusals
        run: |
          node --check scripts/test-p76-mk3-row-assets.cjs
          node scripts/test-p76-mk3-row-assets.cjs
          node --check scripts/verify-mk3-p76-original.cjs
          node --check scripts/verify-p76-browser-row-assets.cjs
          python -m py_compile scripts/verify-mk3-p76-browser-independent.py
          python -m py_compile scripts/verify-p76-checkpoint.py
          python scripts/test-p76-checkpoint.py
      - name: P76 production bundle original-source acceptance runner syntax and fail-closed source controls
        run: |
          node --check scripts/verify-mk3-p76-compiled-original.cjs
          python -m py_compile scripts/verify-mk3-p76-compiled-independent.py
          if node scripts/verify-mk3-p76-compiled-original.cjs > /dev/null 2>&1; then
            echo "P76 compiled original runner incorrectly accepted missing private inputs"
            exit 1
          fi
      - name: P77 source-only chained MK3 indexed records, independent verifier and false-source controls
        run: |
          python -m py_compile scripts/mk3_p77_chained_source_export.py
          python -m py_compile scripts/verify_mk3_p77_chained_source_independent.py
          python scripts/test_mk3_p77_chained_source_export.py
          python scripts/test_mk3_p79_leading_span.py
          python -m py_compile scripts/verify_mk3_p79_leading_span.py
          python scripts/mk3_p77_chained_source_export.py --help > /dev/null
          python scripts/verify_mk3_p77_chained_source_independent.py --help > /dev/null
      - name: P78 new opt-in original MK3 chained indexed sources, source ZIP and refusal controls
        run: |
          node --check scripts/test-p78-mk3-chained-indexed.cjs
          node scripts/test-p78-mk3-chained-indexed.cjs
          node --check scripts/verify-mk3-p78-original.cjs
          node --check scripts/verify-p78-browser-chained.cjs
          python -m py_compile scripts/verify-mk3-p78-browser-independent.py
      - name: P80 original MK3 leading indexed base and raw continuation source-only guards
        run: |
          node --check scripts/test-p80-leading-source.cjs
          node scripts/test-p80-leading-source.cjs
          node --check scripts/verify-mk3-p80-original.cjs
          node --check scripts/verify-p80-browser-leading.cjs
          python -m py_compile scripts/verify-mk3-p80-browser-independent.py
      - name: P81 five-pass original-source and Chrome consolidation acceptance source guards
        run: |
          python -m py_compile scripts/verify-p81-checkpoint.py
          python scripts/test-p81-checkpoint.py
          if python scripts/verify-p81-checkpoint.py --mk1 /nonexistent/mk1 --mk2 /nonexistent/mk2 --mk3 /nonexistent/mk3 --work /tmp/mkdos-p81-false-original > /dev/null 2>&1; then
            echo 'P81 checkpoint incorrectly accepted missing original game fixtures'
            exit 1
          fi
      - name: Production Vite build
        run: npm run build
      - name: TypeScript checks
        run: npm run lint
      - name: Headless Chrome application boot smoke (no game data)
        run: python .github/scripts/windows_ci.py browser
      - name: Upload P77 original-source Python verification kit (scripts only; no commercial assets)
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mk-dos-p77-source-verification-kit
          path: |
            scripts/mk3_p73_noniff_palette_candidates.py
            scripts/mk3_p74_noniff_indexed_graphics.py
            scripts/verify_mk3_p74_noniff_independent.py
            scripts/mk3_p75_noniff_row_tables.py
            scripts/verify_mk3_p75_noniff_independent.py
            scripts/mk3_p77_chained_source_export.py
            scripts/verify_mk3_p77_chained_source_independent.py
            scripts/test_mk3_p77_chained_source_export.py
          if-no-files-found: error
          retention-days: 14
      - name: Upload P78 bounded TypeScript source units for private original-asset byte acceptance
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mk-dos-p78-source-units
          path: |
            src/core/assets/mk3ChainedSourceImagesP78.ts
            src/core/assets/mk3NonIffRowMappedP76.ts
            src/core/assets/model.ts
          if-no-files-found: error
          retention-days: 14
      - name: Upload P80 original TypeScript source units for private original-byte check
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mk-dos-p80-source-units
          path: |
            src/core/assets/mk3LeadingSpanP80.ts
            src/core/assets/mk3NonIffRowMappedP76.ts
            src/core/assets/mk3ChainedSourceImagesP78.ts
            src/core/assets/model.ts
          if-no-files-found: error
          retention-days: 14
      - name: Check for an existing browser build of this commit
        if: success() && inputs.upload_browser
        id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/windows_ci.py duplicate
      - name: Upload verified static build (no original game assets)
        if: success() && steps.duplicate.outputs.upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mk-dos-p11-browser-build
          path: dist/
          if-no-files-found: error
          retention-days: 3
