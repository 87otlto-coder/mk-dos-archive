name: P11 source build smoke

# Build-only quality gate for the consolidated extractor on develop.
# This does not use or distribute original commercial game files.
# Until the original audited package-lock.json is restored, the lockfile
# is generated ephemerally and is NOT considered a reproducible npm-ci gate.
on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/p11-build-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use npm 11 peer-dependency resolver for lockfile generation
        run: npm install --global npm@11.19.1
      - name: Install dependencies (non-reproducible fallback until archived lockfile restored)
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::warning::Audited original package-lock.json is not yet committed; generating temporary lockfile for build smoke only."
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          npm ci --no-audit --no-fund
      - name: Source syntax validation
        run: npm run test:syntax
      - name: Production Vite build
        run: npm run build
      - name: TypeScript checks
        run: npm run lint
      - name: Headless Chrome application boot smoke (no game data)
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/mk-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/mk-preview.log; exit 1; fi
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$browser" ]; then echo 'No Chrome/Chromium browser available on runner'; exit 1; fi
          timeout 50s "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom http://127.0.0.1:4173/ > /tmp/mk-rendered-dom.html 2>/tmp/mk-chrome.log || { cat /tmp/mk-chrome.log; exit 1; }
          if ! grep -Fq 'MK DOS ARCHIVE' /tmp/mk-rendered-dom.html; then
            echo 'React root or brand text not present in rendered DOM'; cat /tmp/mk-rendered-dom.html; cat /tmp/mk-chrome.log; exit 1
          fi
          if ! grep -Fq 'NO SOURCE LINKED' /tmp/mk-rendered-dom.html; then
            echo 'Expected source-offline onboarding did not render'; cat /tmp/mk-rendered-dom.html; cat /tmp/mk-chrome.log; exit 1
          fi
          echo 'PASS: P11 React application mounted, brand and source-offline onboarding visible in headless Chrome.'
