name: MK DOS extractor source build smoke

# Source-only quality gate for interim branches and stable checkpoints.
# No original commercial game files are uploaded, read or distributed here.
# The committed npm 11 lockfile is validated with strict npm ci; the archived
# historical P11 lockfile remains separately preserved and is NOT byte-identical.
on:
  push:
    branches: [develop, main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/p11-build-smoke.yml'
      - '.github/scripts/windows_ci.py'
      - '.github/scripts/browser_retention.py'
      - '.github/scripts/test_browser_retention.py'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/p11-build-smoke.yml'
      - '.github/scripts/windows_ci.py'
      - '.github/scripts/browser_retention.py'
      - '.github/scripts/test_browser_retention.py'
  workflow_dispatch:
    inputs:
      upload_browser:
        description: Store a verified browser build for download
        type: boolean
        default: false

# Serialize requested browser uploads across branches for the repository-wide cap.
concurrency:
  group: ${{ inputs.upload_browser && 'mk-browser-artifact-upload' || format('mk-smoke-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  source-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Use npm 11 peer-dependency resolver for lockfile generation
        run: npm install --global npm@11.19.1
      - name: Strict install from committed dependency lock
        run: npm ci --no-audit --no-fund
      - name: Source syntax validation
        run: npm run test:syntax
      - name: Git-safe tracked-file and P16 input-audit-script guard
        run: python .github/scripts/windows_ci.py guard
      - name: Browser retention reconciliation regression (synthetic artifact listings only)
        run: python .github/scripts/test_browser_retention.py
      - name: Production Vite build
        run: npm run build
      - name: TypeScript checks
        run: npm run lint
      - name: Headless Chrome application boot smoke (no game data)
        run: python .github/scripts/windows_ci.py browser
      - name: Check for an existing browser build of this commit
        if: success() && inputs.upload_browser
        id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/windows_ci.py duplicate
      - name: Upload verified static build (no original game assets)
        if: success() && steps.duplicate.outputs.upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mk-dos-p11-browser-build
          path: dist/
          if-no-files-found: error
          retention-days: 3
